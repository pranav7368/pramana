[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pramana"
version = "0.1.0"
description = "Hallucination detection and self-correction framework for multilingual enterprise RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pranav Kumar Singh" }]
keywords = ["rag", "hallucination-detection", "multilingual", "nli", "calibration"]

# Base install stays deliberately small so the generation layer and the offline
# stub work on a low-RAM laptop without pulling torch.
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "numpy>=1.26,<2.2",
]

[project.optional-dependencies]
# Retrieval + NLI. Install torch from the CPU index first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
nlp = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "sentencepiece>=0.2",
    "indic-transliteration>=2.3",
    "langdetect>=1.0.9",
]
eval = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "datasets>=2.20",
]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pypdf>=6,<7"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "rich>=13.7", "tqdm>=4.66"]

[project.urls]
Repository = "https://github.com/pranav7368/pramana"
Issues = "https://github.com/pranav7368/pramana/issues"
Documentation = "https://github.com/pranav7368/pramana#readme"

[project.scripts]
pramana-check = "pramana.cli.check_env:main"
pramana-probe = "pramana.cli.probe_providers:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pramana = ["config/*.yaml", "config/profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "network: requires a live provider and real API credentials (deselect with -m 'not network')",
    "slow: loads a transformer model",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # RUF001/002/003 flag "ambiguous" Unicode — characters that resemble ASCII.
    # They exist to catch homoglyph attacks and accidental smart quotes. In this
    # project Devanagari and Tamil text is the subject matter: it appears in
    # source (stop-word lists, sentence terminators, regex ranges), in docstrings,
    # and in test fixtures. The rules fire on every legitimate instance, e.g.
    # DEVANAGARI DIGIT ZERO "०" reported as a possible Latin "o".
    # Left on, they would train us to ignore lint output, which is worse than the
    # risk they guard against here.
    "RUF001",  # ambiguous character in a string
    "RUF002",  # ambiguous character in a docstring
    "RUF003",  # ambiguous character in a comment
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
