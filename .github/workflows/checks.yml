name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned pilot and analysis environment
        run: python -m pip install -r requirements-dev.txt
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Type check
        run: python -m mypy src/pramana
      - name: Offline tests with coverage gate
        env:
          PRAMANA_OFFLINE: 'true'
        run: python -m pytest -o addopts='' -q -m "not network and not slow" --cov=pramana --cov-report=term --cov-fail-under=78 --junitxml=test-results.xml
      - name: Publication hygiene
        # The public release gets the full check; the private archive may hold
        # papers and reports but never credentials.
        run: >-
          python scripts/check_publication.py --history
          ${{ github.repository != 'pranav7368/pramana' && '--secrets-only' || '' }}
      - name: Public export guard
        if: hashFiles('scripts/publish_public.py') != ''
        run: python scripts/publish_public.py --check
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: ignore

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel without dependencies
        run: |
          python -m venv /tmp/pramana-wheel
          /tmp/pramana-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/pramana-wheel/bin/python -c "import pramana; print(pramana.__name__)"

  docker:
    name: Offline Docker HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python for the probe
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install -r requirements-pilot.txt
      - name: Install package for the probe
        run: python -m pip install --no-deps -e .
      - name: Build and start offline profile
        run: |
          docker compose -p pramana-ci -f compose.demo.yaml up --build -d
          docker compose -p pramana-ci -f compose.demo.yaml ps
          # "Started" is not "listening": wait for health before probing.
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/v1/health >/dev/null && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/v1/health
      - name: Probe health and offline HTTP contract
        run: python scripts/validate_container_http.py --url http://127.0.0.1:8000 --out reports/ci-container/report.json
      - name: Tear down container
        if: always()
        run: docker compose -p pramana-ci -f compose.demo.yaml down -v
      - name: Build image for vulnerability scan
        run: docker build -t pramana:ci .
      - name: Smoke the public deployment command (offline, no keys)
        run: |
          docker run -d --name pramana-public -p 127.0.0.1:8001:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL -e PRAMANA_PUBLIC_HOST=localhost pramana:ci python scripts/serve_demo.py --public
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8001/v1/health && break
            sleep 2
          done
          curl -fsS http://localhost:8001/ | grep -q "X-Pramana-Session"
          curl -fsS -X POST http://localhost:8001/v1/verify -H 'Content-Type: application/json' \
            -d '{"query":"How long can I appeal a rejected claim?","answer":"Appeals are allowed within 30 days."}' \
            | grep -q '"stop_reason":"audit_only"'
          curl -fsS http://localhost:8001/v1/demo/documents | grep -q '"public":true'
      - name: Remove public smoke container
        if: always()
        run: docker rm -f pramana-public || true
      - name: Scan image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pramana:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
