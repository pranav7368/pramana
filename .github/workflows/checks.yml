name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned pilot environment
        run: python -m pip install -r requirements-pilot.txt
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Lint
        run: python -m ruff check src scripts tests
      - name: Offline tests
        env:
          PRAMANA_OFFLINE: 'true'
        run: python -m pytest -o addopts='' -q -m "not network and not slow" --junitxml=test-results.xml
      - name: Publication hygiene
        run: python scripts/check_publication.py --history
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml
          if-no-files-found: ignore

  package:
    name: Package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Install wheel without dependencies
        run: |
          python -m venv /tmp/pramana-wheel
          /tmp/pramana-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/pramana-wheel/bin/python -c "import pramana; print(pramana.__name__)"

  docker:
    name: Offline Docker HTTP smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python for the probe
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: python -m pip install -r requirements-pilot.txt
      - name: Install package for the probe
        run: python -m pip install --no-deps -e .
      - name: Build and start offline profile
        run: |
          docker compose -p pramana-ci -f compose.demo.yaml up --build -d
          docker compose -p pramana-ci -f compose.demo.yaml ps
      - name: Probe health and offline HTTP contract
        run: python scripts/validate_container_http.py --url http://127.0.0.1:8000 --out reports/ci-container/report.json
      - name: Tear down container
        if: always()
        run: docker compose -p pramana-ci -f compose.demo.yaml down -v
