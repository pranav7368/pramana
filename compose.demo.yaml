# Local rehearsal only. This configuration deliberately uses fixtures.
services:
  pramana:
    build: .
    image: pramana-pilot:local
    init: true
    environment:
      PRAMANA_MODE: demo
      PRAMANA_OFFLINE: 'true'
      PRAMANA_PROVIDERS: stub
      PRAMANA_CORPUS_DIR: /app/corpus
      PRAMANA_CACHE_ENABLED: 'false'
      PRAMANA_EXPOSE_CORPUS: 'true'
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./examples/corpus:/app/corpus:ro
      - demo-state:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
volumes:
  demo-state:
